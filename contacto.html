<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - DevStudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Dev<span>Studio</span></h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="servicios.html">Servicios</a>
                <a href="galeria.html">Galería</a>
                <a href="contacto.html" class="active">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <h2>Ponte en Contacto</h2>
            <p>¿Tienes preguntas o deseas iniciar un nuevo proyecto con nosotros? Envíanos un mensaje.</p>
        </section>

        <div style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 10px; border: 1px solid var(--border-color);">
            <form action="#" method="post" onclick="event.preventDefault();">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Enviar Mensaje</button>
            </form>
        </div>

        <div style="text-align: center; margin-top: 2.5rem;">
            <a href="index.html" class="btn btn-secondary">← Volver a la Página Principal</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevStudio - Proyecto Integrador GPDS</p>
    </footer>
</body>
</html>
